[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "relayops-ai"
version = "0.1.0"
description = "Evidence-bound intake and routing for synthetic municipal field operations."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.6,<1", "httpx>=0.27,<1"]

[project.scripts]
relayops = "relayops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
